# Wormsign: a sandworm crosses the contribution graph and devours it.
# Renders light + dark variants to the `output` branch every 12h.
name: sandworm

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wormsign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: summon
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sandworm-light.svg?color_snake=#9a4f1e&color_dots=#f3e6d0,#e8c99a,#d9a35f,#c2703d,#8a4a1f
            dist/sandworm-dark.svg?color_snake=#e8a33d&color_dots=#1a1210,#3d2516,#6b4223,#a8642f,#e8a33d

      - name: deposit on the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

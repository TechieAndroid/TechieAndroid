<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Austin Kilgore — Automation Engineer, homelab operator, console surgeon">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf1e1"/><stop offset=".62" stop-color="#f4d9b0"/><stop offset="1" stop-color="#e9b377"/>
</linearGradient>
<radialGradient id="horizon" cx=".5" cy="1" r=".75">
  <stop offset="0" stop-color="#fff1d0" stop-opacity=".55"/>
  <stop offset="1" stop-color="#fff1d0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orb" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#fff8e8" stop-opacity=".9"/>
  <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="rule" x1="0" x2="1">
  <stop offset="0" stop-color="#9a4f1e" stop-opacity="0"/><stop offset=".5" stop-color="#9a4f1e"/><stop offset="1" stop-color="#9a4f1e" stop-opacity="0"/>
</linearGradient>
<linearGradient id="streak" x1="0" x2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
</linearGradient>
</defs>
<style>
.tw{animation:tw ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.d1{animation:drift 34s ease-in-out infinite alternate}
.d2{animation:drift 26s ease-in-out infinite alternate-reverse}
.d3{animation:drift 21s ease-in-out infinite alternate}
.d4{animation:drift 17s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
.float{animation:float 14s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.pulse{animation:pulse 7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.sand{opacity:0;animation:wind linear infinite}
@keyframes wind{0%{opacity:0;transform:translate(0,0)}15%{opacity:.85}80%{opacity:.6}100%{opacity:0;transform:translate(-340px,-46px)}}
.rise{opacity:0;animation:rise 1.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.r2{animation-delay:.55s} .r3{animation-delay:1.1s}
.grow{transform-origin:600px 0;transform:scaleX(0);animation:grow 1.8s .4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.blink{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.shoot{stroke-dasharray:140 1400;stroke-dashoffset:140;animation:shoot 11s 3s linear infinite}
@keyframes shoot{0%{stroke-dashoffset:140;opacity:1}7%{stroke-dashoffset:-460;opacity:0}100%{stroke-dashoffset:-460;opacity:0}}
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}.grow{transform:none}.sand{opacity:0}}
</style>

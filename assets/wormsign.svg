.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite;opacity:0}
@keyframes ring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.travel{transform:translateX(600px)}}
